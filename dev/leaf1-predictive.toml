# Leaf1 configuration with Predictive Cache enabled

[server]
listen = "[::]:4444"

# Generate self-signed certificate for localhost
tls.generate = ["localhost"]

[web.http]
# Listen for HTTP API on the same port as QUIC
listen = "[::]:4444"

[cluster]
# Connect to Root
root = "localhost:4443"
token = "dev/root.jwt"

# Advertise ourselves to Root
node = "localhost:4444"

# Data cache configuration (buffers actual frame data)
[cluster.data_cache]
enabled = true
prefetch_patterns = ["live/**", "sports/**", "moq-clock"]
max_groups_per_track = 3  # Ring buffer size
ttl_seconds = 60

[client.tls]
disable_verify = true

[auth]
# Use the same key as Root for consistency
key = "dev/root.jwk"

# Allow anonymous access for testing
public = "anon"
