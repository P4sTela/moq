# Leaf1 configuration without Predictive Cache (for comparison)

[server]
listen = "[::]:4444"
tls.generate = ["localhost", "100.81.137.8"]

[web.https]
listen = "[::]:4444"
cert = "dev/certs/cert.pem"
key = "dev/certs/key.pem"

[cluster]
root = "localhost:4443"
token = "dev/root.jwt"
node = "localhost:4444"

# Predictive cache disabled
[cluster.predictive_cache]
enabled = false

[client.tls]
disable_verify = true

[auth]
key = "dev/root.jwk"
public = "anon"
