[package]
name = "moq-loadtest"
description = "Native QUIC load test tool for MoQ relay"
authors = ["Kouta Sato"]
license = "MIT OR Apache-2.0"

version = "0.1.0"
edition = "2021"

keywords = ["quic", "moq", "load-test", "benchmark"]
categories = ["network-programming"]

[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
moq-lite = { workspace = true }
moq-native = { workspace = true }
serde = { workspace = true }
serde_json = "1"
tokio = { workspace = true, features = ["full"] }
web-transport-quinn = { workspace = true }
num_cpus = "1"
tracing = "0.1"
url = "2"
