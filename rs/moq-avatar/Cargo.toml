[package]
name = "moq-avatar"
description = "Multi-track bidirectional avatar simulation for MoQ metaverse research"
authors = ["Kouta Sato"]
license = "MIT OR Apache-2.0"

version = "0.1.0"
edition = "2021"

keywords = ["quic", "moq", "metaverse", "avatar", "multitrack"]
categories = ["multimedia", "network-programming", "simulation"]

[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
moq-lite = { workspace = true }
moq-native = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = "0.1"
url = "2"
serde = { workspace = true }
serde_json = "1"
rand = "0.8"
